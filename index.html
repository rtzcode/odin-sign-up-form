<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Sign-up Form</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="sanitize.css" />
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<div class="container">
			<div class="aside">
				<header class="logo">
					<img src="img/logo.png" alt="company logo" width="100px" />
					<h1>LOGO</h1>
				</header>
				<span class="attribution">
					Photo by
					<a
						target="_blank"
						rel="noopener noreferrer"
						href="https://unsplash.com/@rakithaperera?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText"
						>Rakitha Perera</a
					>
					on
					<a
						target="_blank"
						rel="noopener noreferrer"
						href="https://unsplash.com/photos/a-desktop-computer-with-a-clock-and-speakers-XQGXk50HB1A?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText"
						>Unsplash</a
					>
				</span>
			</div>
			<div class="main">
				<section>
					<p>
						This is not a real online service! You know you need
						something like this in your life to help you realize
						your deepest dreams. Sign up <em>now</em> to get
						started.
					</p>
					<p>You <em>know</em> you want to.</p>
				</section>
				<form action="#" method="post" class="form">
					<fieldset class="flex-container">
						<h2>Let's do this</h2>
						<div class="input-container">
							<label for="name-first">First Name</label>
							<input
								type="text"
								id="name-first"
								name="name-last"
								required
							/>
						</div>
						<div class="input-container">
							<label for="name-last">Last Name</label>
							<input
								type="text"
								id="name-last"
								name="name-last"
								required
							/>
						</div>
						<div class="input-container">
							<label for="email">Email</label>
							<input
								type="email"
								placeholder="name@example.com"
								id="email"
								name="email"
								required
							/>
						</div>
						<div class="input-container">
							<label for="phone">Phone</label>
							<input
								type="tel"
								pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}"
								maxlength="12"
								placeholder="123-456-7890"
								id="phone"
								name="phone"
								required
							/>
						</div>
						<div class="input-container">
							<label for="password">Password</label>
							<input
								type="password"
								id="password"
								placeholder="At least 8 characters"
								minlength="8"
								required
							/>
						</div>
						<div class="input-container">
							<label for="password-confirm"
								>Confirm password</label
							>
							<input
								type="password"
								placeholder="At least 8 characters"
								id="password-confirm"
								name="password"
								minlength="8"
								required
							/>
						</div>
					</fieldset>
					<section class="login">
						<button type="submit">Create Account</button>
						<p>Already have an account? <a href="#">Log in</a></p>
					</section>
				</form>
			</div>
		</div>
		<script src="script.js"></script>
	</body>
</html>
