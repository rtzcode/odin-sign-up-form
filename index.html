<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Sign-up Form</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="sanitize.css" />
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<div class="container">
			<div class="aside">
				<header class="logo">
					<img src="img/logo.png" alt="company logo" width="110px" />
					<h1>LOGO</h1>
				</header>
				<span class="attribution">
					Photo by
					<a
						target="_blank"
						rel="noopener noreferrer"
						href="https://unsplash.com/@rakithaperera?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText"
						>Rakitha Perera</a
					>
					on
					<a
						target="_blank"
						rel="noopener noreferrer"
						href="https://unsplash.com/photos/a-desktop-computer-with-a-clock-and-speakers-XQGXk50HB1A?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText"
						>Unsplash</a
					>
				</span>
			</div>
			<div class="main">
				<section>
					<p>
						This is not a real online service! You know you need
						something like this in your life to help you realize
						your deepest dreams. Sign up now to get started.
					</p>
					<p>You know you want to.</p>
				</section>
				<form action="#" method="get">
					<fieldset>
						<legend>Let's do this</legend>
						<label for="name-first">First Name</label>
						<input
							type="text"
							id="name-first"
							name="name-last"
							required
						/>
						<label for="name-last">Last Name</label>
						<input
							type="text"
							id="name-last"
							name="name-last"
							required
						/>
						<label for="email">Email</label>
						<input
							type="email"
							placeholder="name@example.com"
							id="email"
							name="email"
							required
						/>
						<label for="phone">Phone</label>
						<input
							type="tel"
							pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}"
							maxlength="12"
							placeholder="123-456-7890"
							id="phone"
							name="phone"
							required
						/>
						<label for="password">Password</label>
						<input
							type="password"
							id="password"
							minlength="8"
							required
						/>
						<label for="password-confirm">Confirm password</label>
						<input
							type="password"
							id="password-confirm"
							name="password"
							minlength="8"
							required
						/>
					</fieldset>
				</form>
			</div>
		</div>
		<script src="script.js"></script>
	</body>
</html>
